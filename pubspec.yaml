name: merging_builder

description: Builder that reads multiple input files and writes merged output
  to one single file.

version: 1.0.0

homepage: https://github.com/simphotonics/merging_builder

topics:
  - builder
  - build-runner
  - code-generator

environment:
  sdk: '^3.9.0'

dependencies:
  analyzer: ^14.1.0
  build: ^4.0.10
  build_runner: ^2.16.0
  dart_style: ^3.1.12
  directed_graph: ^0.5.6
  exception_templates: ^0.3.2
  file: ^7.0.1
  glob: ^2.1.3
  lazy_memo: ^0.2.5
  path: ^1.9.1
  source_gen: ^4.2.4

#dependency_overrides:
# source_gen:
#   git:
#     url: git@github.com:dart-lang/source_gen.git
#     ref: master
#     path: source_gen
dev_dependencies:
  build_test: ^3.5.19
  lints: ^6.1.0
  test: ^1.31.1
