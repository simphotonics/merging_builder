name: merging_builder

description: MergingBuilder reads several input files and writes merged output
  to one file. StandaloneBuilder enables output to a custom folder with custom
  output file name.

version: 0.2.8

homepage: https://github.com/simphotonics/merging_builder

topics:
  - builder
  - build-runner
  - source-code-generator

environment:
  sdk: '^3.9.0'

dependencies:
  analyzer: ^8.3.0
  build: ^4.0.1
  build_runner: ^2.9.0
  dart_style: ^3.1.2
  directed_graph: ^0.4.5
  exception_templates: ^0.3.2
  file: ^7.0.1
  glob: ^2.1.3
  lazy_memo: ^0.2.3
  path: ^1.9.1
  source_gen: ^4.0.2

#dependency_overrides:
# source_gen:
#   git:
#     url: git@github.com:dart-lang/source_gen.git
#     ref: master
#     path: source_gen
dev_dependencies:
  build_test: ^3.4.1
  lints: ^6.0.0
  test: ^1.26.3
